name: Validate repository
description: Runs the KiCad ERC and DRC checks on the board, called by the hub validate-task after its own checkout.

inputs:
  kicad-image:
    description: KiCad CLI container image, pinned by digest (10.0.7).
    required: false
    default: kicad/kicad@sha256:3224d1bf143185ecc1bd3a1082a36f37f0f4e59d707983a16515a845e3737fc6

runs:
  using: composite
  steps:

    - name: Pull KiCad CLI image step
      shell: bash
      env:
        KICAD_IMAGE: ${{ inputs.kicad-image }}
      run: |
        set -Eeuo pipefail
        docker pull "$KICAD_IMAGE"

    - name: Run ERC and DRC step
      shell: bash
      env:
        KICAD_IMAGE: ${{ inputs.kicad-image }}
      run: |
        set -Eeuo pipefail
        docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work -w /work "$KICAD_IMAGE" sh -c '
          set -eu
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/"
          kicad-cli version
          status=0
          kicad-cli sch erc --severity-all --exit-code-violations -o /tmp/erc.rpt DevKitCIoT.kicad_sch || status=$?
          cat /tmp/erc.rpt
          kicad-cli pcb drc --schematic-parity --severity-all --exit-code-violations -o /tmp/drc.rpt DevKitCIoT.kicad_pcb || status=$?
          cat /tmp/drc.rpt
          exit "$status"'
