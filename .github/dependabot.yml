# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The github-actions ecosystem covers every workflow and composite action this repo ships.
# Both main and develop are targeted so each stays current independently of the develop to main release cadence.
# The merge-bot auto-merges each base with its per-base method.
version: 2
updates:

  - package-ecosystem: "github-actions"
    target-branch: "main"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"
