name: Test pull request action

# Thin caller: the doc lint gates and the validate hook run in the hub's reusable validate-task.yml.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  validate:
    name: Validate sources job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@7cfe988effe266d2eceaaaa2be27c7e39373c1a5 # 2.0.1361
    permissions:
      contents: read

  # The always-run aggregator is the one status check a ruleset can require, so rename it and any ruleset requiring it together.
  check-workflow-status:
    name: ${{ github.event_name == 'pull_request' && 'Check pull request workflow status job' || 'Check workflow status job' }}
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "::error::Job 'validate' did not succeed (${{ needs.validate.result }})."
            exit 1
          fi
